<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Trip Planner · AI行程规划</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1426">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI行程">
<link rel="apple-touch-icon" href="img/icons/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/icon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#CFE0EE; --land:#F3F1EA; --land-edge:#B9C6D3; --sea-halo:#F3F1EA;
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#141B2D; --ink-2:#47526B; --ink-3:#7C869C;
  --line:#DEE4EE; --night:#0D1426; --night-2:#18223D; --snow:#F4F7FF;
  --accent:#E2452B; --accent-ink:#FFFFFF; --good:#1E9E78;
  --shadow:0 10px 30px -12px rgba(20,27,45,.25);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:0; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#0F1B2E; --land:#1C2740; --land-edge:#33415F; --sea-halo:#1C2740;
    --bg:#0A0F1C; --surface:#151D31; --surface-2:#1B2540; --ink:#EEF2FA; --ink-2:#B3BDD2; --ink-3:#7F8AA3;
    --line:#26314D; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0F1B2E; --land:#1C2740; --land-edge:#33415F; --sea-halo:#1C2740;
  --bg:#0A0F1C; --surface:#151D31; --surface-2:#1B2540; --ink:#EEF2FA; --ink-2:#B3BDD2; --ink-3:#7F8AA3;
  --line:#26314D; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* HERO */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 80% 0%,#2A3A6E 0%,var(--night) 60%);color:var(--snow);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 26px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* AI collage backdrop (gpt-image-2.5): slow Ken Burns drift under a navy scrim, snow canvas on top */
.hero{min-height:min(620px,88svh);display:flex;flex-direction:column}
.hero-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hero-bg i{position:absolute;inset:-6%;background:var(--night) var(--heroP,none) 70% 30%/cover no-repeat;animation:kb 32s ease-in-out infinite alternate,heroIn 1.6s ease-out both}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,20,38,.62) 0%,rgba(13,20,38,.22) 55%,rgba(13,20,38,0) 100%),linear-gradient(180deg,rgba(13,20,38,.5) 0%,rgba(13,20,38,0) 22%,rgba(13,20,38,0) 40%,rgba(13,20,38,.6) 70%,rgba(13,20,38,.92) 100%)}
@media (min-width:700px){.hero-bg i{background-image:var(--heroW,none);background-position:right center}}
@keyframes kb{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.07) translate(-1.5%,1%)}100%{transform:scale(1.12) translate(1.5%,-1.5%)}}
@keyframes heroIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero h1,.hero .sub,.hero-stats{animation:rise .9s ease-out both}
.hero .sub{animation-delay:.15s}.hero-stats{animation-delay:.3s}
.hero h1,.hero .sub{text-shadow:0 2px 18px rgba(13,20,38,.7)}
.hero-in{width:100%;flex:1;display:flex;flex-direction:column}
.hero .hero-in>h1{margin-top:auto;padding-top:48px}
@media (prefers-reduced-motion:reduce){.hero-bg i,.hero h1,.hero .sub,.hero-stats{animation:none}}
.hero-in{position:relative;max-width:720px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;opacity:.75}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--snow);font-size:13px;padding:4px 12px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--snow);color:var(--night)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,11vw,64px);line-height:1.02;margin:22px 0 8px;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:#FF8A6B}
.hero .sub{opacity:.8;font-size:15px;margin:0;max-width:34em}
.hero-stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hs{background:rgba(13,20,38,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;flex:1 1 0;min-width:68px;max-width:130px}
.hs b{display:block;font-family:var(--mono);font-size:22px;line-height:1.1}
.hs span{font-size:12px;opacity:.75}
.hs.cd{background:#FF8A6B;border-color:#FF8A6B;color:var(--night)}
.hs.cd span{opacity:.85}
.topbar{flex-wrap:wrap;gap:8px}
.toggles{display:flex;gap:6px}
.rm{display:block;font-size:.7em;opacity:.7;font-weight:500;line-height:1.3}
.fxcard{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.fxrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:15px}
.fxrow input{width:90px;font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.seg3{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-top:12px;width:max-content}
.seg3 button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fxnote{font-size:12px;color:var(--ink-3);margin:10px 0 0}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* DAY STRIP */
.strip{display:flex;gap:10px;overflow-x:auto;padding:18px 16px 8px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:center;flex:0 0 auto;width:96px;border:0;border-radius:18px;padding:10px 10px 12px;text-align:left;background:var(--surface);box-shadow:var(--shadow);position:relative;transition:transform .2s}
.chip .em{font-size:22px;line-height:1}
.chip .n{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink-3);display:block;margin-top:8px}
.chip .s{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-selected="true"]{background:var(--dc);color:#fff;transform:translateY(-3px)}
.chip[aria-selected="true"] .n{color:rgba(255,255,255,.8)}

/* DAY HERO */
/* Day card: full-bleed AI photo per day (img/dayN.webp), story-style progress, swipe to change day */
.dayhero{margin-top:12px;border-radius:24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--dc) 0%,var(--dc2) 100%);box-shadow:var(--shadow);min-height:470px;display:flex;flex-direction:column;touch-action:pan-y}
.dh-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dh-bg i{position:absolute;inset:-5%;background:var(--img) 60% 35%/cover no-repeat;animation:dhIn 1.1s ease-out both,kb 28s ease-in-out 1.1s infinite alternate}
.dh-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,26,.55) 0%,rgba(10,14,26,0) 24%,rgba(10,14,26,0) 38%,rgba(10,14,26,.55) 62%,rgba(10,14,26,.9) 100%),linear-gradient(0deg,color-mix(in srgb,var(--dc) 45%,transparent) 0%,transparent 45%)}
@keyframes dhIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
.dh-prog{position:relative;display:flex;gap:4px;padding:12px 14px 0}
.dh-prog button{flex:1;height:14px;border:0;padding:5px 0;background:none;cursor:pointer}
.dh-prog button i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.dh-prog button.past i{background:rgba(255,255,255,.85)}
.dh-prog button.now i{background:linear-gradient(90deg,#fff 50%,rgba(255,255,255,.35) 50%);background-size:200% 100%;animation:fillbar 1.2s ease-out .2s both}
@keyframes fillbar{from{background-position:100% 0}to{background-position:0 0}}
.dh-top{position:relative;display:flex;align-items:center;gap:10px;padding:8px 16px 0}
.dh-badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3)}
.dh-top .date{font-family:var(--mono);font-size:12px;letter-spacing:.1em;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.dh-top .date b{display:block;font-size:11px;opacity:.8;font-weight:500}
.dayhero .big{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.75)}
.dh-body{position:relative;margin-top:auto;padding:0 18px 18px}
.dh-body>*{animation:rise .7s ease-out both}
.dh-body>:nth-child(2){animation-delay:.08s}.dh-body>:nth-child(3){animation-delay:.16s}.dh-body>:nth-child(4){animation-delay:.24s}
.dayhero h2{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.2;margin:0 0 8px;text-shadow:0 2px 16px rgba(0,0,0,.55)}
.dayhero p{margin:0;font-size:15px;line-height:1.55;opacity:.95;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(10,14,26,.42);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill b{font-weight:700}
.dh-foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.dh-foot .go{margin-top:0}
.dh-swipe{font-size:12px;opacity:.7;margin-left:auto}
@media (prefers-reduced-motion:reduce){.dh-bg i,.dh-body>*,.dh-prog button.now i{animation:none}}
.routes{display:flex;flex-direction:column;gap:8px}
.rleg,.rfull{display:grid;grid-template-columns:26px auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;text-decoration:none;box-shadow:var(--shadow)}
.rleg i{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--dc);color:#fff;display:grid;place-items:center}
.rleg .rm2{font-size:12px;color:var(--ink-3);white-space:nowrap}
.rleg b{font-size:14px;font-weight:600;line-height:1.35}
.rleg em{font-style:normal;color:var(--ink-3)}
.rfull{grid-template-columns:1fr;gap:4px;background:linear-gradient(135deg,var(--dc),var(--dc2));color:#fff}
.rfull span{font-size:12px;opacity:.85;font-weight:700}
.rfull b{font-size:15px;line-height:1.4}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;position:relative}
:root[data-theme="dark"] .go{color:#141B2D}

/* MAP */

.dmap{margin-top:14px;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mwrap{position:relative;height:340px;background:var(--surface-2)}
.mwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-3)}
.mwrap iframe{position:relative;display:block;width:100%;height:100%;border:0}
.dcap{display:flex;align-items:center;gap:8px;padding:10px 12px}
.dcap span{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.35}
.dcap a,.dcap button{flex:0 0 auto;font:inherit;font-size:12px;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:0;cursor:pointer;white-space:nowrap}
.rleg{cursor:pointer;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.rleg[aria-pressed="true"]{outline:2px solid var(--dc);outline-offset:-2px}
.rleg a{font-style:normal;color:var(--ink-3);text-decoration:none;font-size:13px;padding:4px 6px;border-radius:8px;background:var(--surface-2)}
.mapcard{margin-top:14px;border-radius:24px;overflow:hidden;background:var(--night);box-shadow:var(--shadow);position:relative}
.mapcard svg{display:block;width:100%;height:auto}
.maplabel{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:rgba(244,247,255,.6)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes pulse{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
.seg{stroke-dasharray:var(--len);animation:draw 1.4s ease-out forwards}
.pulse{animation:pulse 1.8s ease-out infinite}

/* SECTION TITLES */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 10px}
.sec h3{margin:0;font-family:var(--serif);font-weight:900;font-size:22px}
.sec span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* TIMELINE */
.tl{list-style:none;margin:0;padding:0}
.st{position:relative;padding-left:62px;margin-bottom:10px}
.st::before{content:"";position:absolute;left:47px;top:0;bottom:-10px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .tm{position:absolute;left:0;top:14px;width:40px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-2)}
.st .nd{position:absolute;left:40px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--dc)}
.st.done .nd{background:var(--dc)}
.st.stay .nd{background:var(--ink);border-color:var(--ink)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card summary{list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.card .ttl{flex:1;min-width:0}
.card h4{margin:0;font-size:16px;font-weight:700;line-height:1.35}
.card .jp{font-size:12px;color:var(--ink-3)}
.card .chev{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;transition:transform .2s;font-size:12px;color:var(--ink-2)}
.card details[open] .chev{transform:rotate(180deg)}
.card .more{padding:0 14px 14px}
.card .thb{flex:0 0 auto;width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.card details[open] .thb{display:none}
.card .ph{margin:0 0 12px;border-radius:14px;overflow:hidden;position:relative;background:var(--surface-2)}
.card .ph img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.card .ph figcaption{position:absolute;right:8px;bottom:8px;font-size:10px;line-height:1}
.card .ph a{display:inline-block;color:#fff;background:rgba(0,0,0,.5);padding:4px 7px;border-radius:7px;text-decoration:none}
.card .more p{margin:0;color:var(--ink-2);font-size:15px}
.card .more ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}
.st.done h4{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin:10px 6px 0 0}
.tag.warn{background:#FFE7E1;color:#B8321A}
.tag.nav{background:var(--surface-2);color:var(--ink-2);font-family:var(--mono);font-weight:500}
:root[data-theme="dark"] .tag.warn{background:#3B1D1A;color:#FF9C85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.warn{background:#3B1D1A;color:#FF9C85}}
.badge{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#FF6B4A}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts a,.acts button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;text-decoration:none}
.acts button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.leg{position:relative;padding:4px 0 4px 62px;margin-bottom:10px;font-size:13px;color:var(--ink-3)}
.leg::before{content:"";position:absolute;left:47px;top:-10px;bottom:-10px;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.leg span{display:inline-block;background:var(--surface-2);border-radius:12px;padding:6px 10px}

/* EAT */
.eats{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.eats::-webkit-scrollbar{display:none}
.eat{scroll-snap-align:start;flex:0 0 78%;max-width:300px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.eat .ml{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dc);font-weight:700;text-transform:uppercase}
.eat h4{margin:6px 0 6px;font-size:17px;line-height:1.3}
.eat p{margin:0;font-size:14px;color:var(--ink-2);flex:1}
.eat .pr{margin-top:12px;font-family:var(--mono);font-size:13px;font-weight:700}

/* STAY */
/* Stay card: per-night photo (img/stayN.webp) with night badge, price and nearby-search button */
.staycard{background:var(--night);color:var(--snow);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sc-photo{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,var(--dc),var(--night))}
.sc-photo i{position:absolute;inset:-4%;background:var(--img) center/cover no-repeat;animation:dhIn 1.1s ease-out both,kb 30s ease-in-out 1.1s infinite alternate}
.sc-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,20,38,.45) 0%,rgba(13,20,38,0) 28%,rgba(13,20,38,0) 50%,rgba(13,20,38,.92) 100%)}
.sc-tags{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;z-index:1}
.sc-tags span{background:rgba(13,20,38,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:12px;font-family:var(--mono);letter-spacing:.04em}
.sc-title{position:absolute;left:16px;right:16px;bottom:12px;z-index:1}
.staycard h4{font-family:var(--serif);font-size:23px;margin:0 0 2px;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.staycard .ty{opacity:.85;font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.sc-body{padding:14px 16px 16px}
.sc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.staycard .price{display:inline-block;background:#FF8A6B;color:var(--night);border-radius:12px;padding:7px 12px;font-family:var(--mono);font-size:13px;font-weight:700}
.sc-nights{display:flex;align-items:center;gap:5px;font-size:12px;opacity:.85;margin-left:auto}
.sc-nights i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--snow);display:inline-block}
.sc-nights i.on{background:var(--snow)}
.staycard p{margin:12px 0 0;font-size:14px;line-height:1.6;opacity:.88;display:flex;gap:8px}
.staycard p span{flex:0 0 auto}
.staycard p span+span{flex:1 1 auto;min-width:0}
.sc-find{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:10px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--snow);text-decoration:none;font-weight:700;font-size:14px}

/* COST */
.cost{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cost .tot{display:flex;align-items:baseline;justify-content:space-between}
.cost .tot b{font-family:var(--mono);font-size:30px;line-height:1}
.cost .tot span{color:var(--ink-3);font-size:13px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 12px;background:var(--surface-2)}
.bar i{display:block;height:100%}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;color:var(--ink-2)}
.crow .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.crow b{font-family:var(--mono);font-weight:500;color:var(--ink);white-space:nowrap}
.note{font-size:13px;color:var(--ink-3);margin:10px 2px 0}

.pager{display:flex;gap:10px;margin:26px 0 8px}
.pager button{flex:1;border:0;border-radius:16px;padding:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;font-size:13px;color:var(--ink-3)}
.pager button b{display:block;color:var(--ink);font-size:15px}
.pager button:last-child{text-align:right}
.pager button:disabled{opacity:.35}

/* PREP & INFO */
.ring{display:flex;align-items:center;gap:18px;background:var(--night);color:var(--snow);border-radius:24px;padding:20px;margin-top:18px}
.ring svg{flex:0 0 auto}
.ring h3{font-family:var(--serif);font-size:22px;margin:0}
.ring p{margin:4px 0 0;font-size:14px;opacity:.8}
.grp{background:var(--surface);border-radius:20px;padding:6px 16px;margin-top:14px;box-shadow:var(--shadow)}
.grp h4{margin:12px 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);margin:0;display:grid;place-items:center;transition:all .15s}
.chk input:checked{background:var(--good);border-color:var(--good)}
.chk input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.chk span{font-size:15px;font-weight:500}
.chk small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.chk input:checked + span{color:var(--ink-3);text-decoration:line-through}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sos a{background:var(--surface);border-radius:18px;padding:14px;text-decoration:none;box-shadow:var(--shadow)}
.sos a b{display:block;font-family:var(--mono);font-size:22px;color:#E2452B}
.sos a span{font-size:13px;color:var(--ink-2)}
.list{background:var(--surface);border-radius:20px;padding:6px 16px;box-shadow:var(--shadow)}
.list div{padding:11px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink-2);display:flex;gap:12px}
.list div:first-child{border-top:0}
.list div i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px;flex:0 0 18px}
.bud{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.brow{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.brow .bt{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:5px}
.brow b{font-family:var(--mono);font-weight:500;font-size:13px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.split div{background:var(--night);color:var(--snow);border-radius:16px;padding:12px;text-align:center}
.split b{display:block;font-family:var(--mono);font-size:17px}
.split span{font-size:12px;opacity:.75}

/* TAB BAR */
/* Voice translator */
.voice{background:linear-gradient(160deg,var(--night),var(--night-2));color:var(--snow);border-radius:22px;box-shadow:var(--shadow);padding:14px}
.vlang{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}
.vlang span{opacity:.8}
.vlang .trdir button{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--snow);padding:5px 12px}

.vlang .trdir button:disabled{opacity:.5}
.vlog{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.vhint{margin:0;font-size:13px;line-height:1.55;opacity:.75}
.vb{position:relative;max-width:86%;border-radius:16px;padding:9px 40px 9px 12px;animation:rise .3s ease-out both}
.vb.me{align-self:flex-end;background:var(--dc);border-bottom-right-radius:4px}
.vb.them{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:4px}
.vo{position:relative}

.vb .vo button{right:-34px}

.vb b{display:block;font-size:18px;line-height:1.45;margin-top:2px}

.vlive{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3);font-size:16px;line-height:1.5;min-height:22px}
.vmsg{margin:10px 0 0;font-size:13px;color:#FFB4A2}
.vmsg.busy{color:var(--snow);opacity:.85}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vbtn{border:0;border-radius:18px;padding:14px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;position:relative}
.vbtn.me{background:var(--dc)}
.vbtn.them{background:#FF8A6B;color:var(--night)}
.vbtn span{font-size:28px;line-height:1.1}

.vbtn:disabled{opacity:.4}
.vbtn.rec{background:#E5484D;color:#fff;animation:vpulse 1.2s ease-in-out infinite}

.vset{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.vset span{flex:1;opacity:.85}
.vset button,.vrow button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--snow);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.vform{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:12px}
.vform label{display:flex;flex-direction:column;gap:5px;font-size:12px;opacity:.9}
.vform input,.vform select{font:inherit;font-size:15px;border:1px solid rgba(255,255,255,.25);background:rgba(13,20,38,.6);color:var(--snow);border-radius:10px;padding:9px 10px;width:100%}
.vrow{display:flex;gap:8px;align-items:center}
.vsend{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vsend>button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--snow);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.vqr{background:#fff;padding:12px;border-radius:14px;line-height:0;color:#111;font-size:13px}

.vrow input,.vrow select{flex:1;min-width:0}
.vrow button[data-vt]{flex:0 0 auto;padding:8px 12px}
.vwarn{margin:0;font-size:13px;line-height:1.55;color:#FFD2A6}
.vlink{border:0;background:none;color:var(--snow);font-size:14px;cursor:pointer;padding:0 4px}
@media (prefers-reduced-motion:reduce){.vbtn.rec,.vb{animation:none}}

.tracts{display:flex;gap:8px;margin-top:10px}

#showja{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;cursor:pointer}

.abar{pointer-events:auto;width:100%;max-width:480px;display:flex;align-items:center;gap:10px;background:var(--night);color:var(--snow);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(13,20,38,.35);font-size:13px;line-height:1.45;animation:rise .35s ease-out both}

<script>
/* ---- Accounts (Railway server only; window.__TP is inlined by server.js). The account's saved app data is written
   into localStorage before the app starts, and every later change to a synced tripai: key is sent back
   (/api/state, debounced; unsent changes wait in tripai:__pending and survive reloads and offline use).
   tripai:__rev = the server revision this device has, so an older cached page never overwrites newer data. ---- */
const TP = window.__TP || null;
const DEVICE_KEYS = ["tripai:aikey","tripai:elkey","tripai:warmed","tripai:instdismiss","tripai:__pending","tripai:__uid","tripai:__rev"];
const syncedKey = k => typeof k === "string" && k.startsWith("tripai:") && !DEVICE_KEYS.includes(k);
if (TP) (function(){
  const L = localStorage, SP = Storage.prototype, oSet = SP.setItem, oRem = SP.removeItem;
  let q = {};
  try {
    if (L.getItem("tripai:__uid") !== TP.uid) { Object.keys(L).filter(k => k.startsWith("tripai:")).forEach(k => L.removeItem(k)); L.setItem("tripai:__uid", TP.uid); }
    q = JSON.parse(L.getItem("tripai:__pending") || "{}") || {};
    if (TP.rev >= (+L.getItem("tripai:__rev") || 0)) {
      Object.keys(L).filter(syncedKey).forEach(k => { if (!(k in TP.state) && !(k in q)) L.removeItem(k); });
      for (const k in TP.state) if (!(k in q)) L.setItem(k, TP.state[k]);
      L.setItem("tripai:__rev", String(TP.rev));
    }
    for (const k in q) { if (q[k] === null) L.removeItem(k); else L.setItem(k, q[k]); }
  } catch(e) {}
  let timer = null, busy = false;
  const savePend = () => { try { oSet.call(L, "tripai:__pending", JSON.stringify(q)); } catch(e) {} };

    clearTimeout(timer); timer = null; if (busy || !Object.keys(q).length) return; busy = true;
    const items = Object.assign({}, q), body = JSON.stringify({items});

      if (r.ok) { const j = await r.json(); for (const k in items) if (q[k] === items[k]) delete q[k]; savePend(); oSet.call(L, "tripai:__rev", String(j.rev)); }

async function aiJSON(name, schema, sys, user, o){
  const body = {model:genModel(), reasoning:{effort:o.effort || "low"}, max_output_tokens:32000,
    input:[{role:"system", content:sys}, {role:"user", content:user}], text:{format:{type:"json_schema", name, strict:true, schema}}};
  if (o.web) body.tools = [{type:"web_search"}];
  for (let n = 0; ; n++) {
    try {
      const r = await fetch(OAI+"/responses", {method:"POST", signal:o.signal, headers:Object.assign({Authorization:"Bearer "+aiKey, "Content-Type":"application/json"}, o.kind && onServer(aiKey) ? {"X-TP-Kind":o.kind} : {}), body:JSON.stringify(body)});
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) throw Object.assign(new Error("key"), {fatal:true});
      if (!r.ok || j.error) throw Object.assign(new Error((j.error && j.error.message) || ("HTTP "+r.status)), {fatal:[400,403,404,413,429,503].includes(r.status)});
      if (j.status === "incomplete") throw new Error("incomplete: "+((j.incomplete_details && j.incomplete_details.reason) || ""));
      const out = (j.output || []).flatMap(x => x.content || []).find(c => c.type === "output_text");
      if (!out) throw new Error("empty answer");
      return JSON.parse(out.text);
    } catch(e) { if (e.fatal || e.name === "AbortError" || n >= 1) throw e; }
  }
}
async function pool(tasks, k){ let i = 0; await Promise.all(Array.from({length:Math.min(k, tasks.length)}, async () => { while (i < tasks.length) await tasks[i++](); })); }

/* English Wikipedia lead image → [960px Commons image, Commons file page]; non-Commons (non-free) images are skipped */
async function wikiImg(title, cache, search){
  if (!title) return null; if (title in cache) return cache[title];
  let res = null;
  try {
    const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(String(title).trim().replace(/ /g,"_"))+"?redirect=true");
    if (r.ok) { const j = await r.json(), o = j.originalimage || j.thumbnail, src = ((o && o.source) || "").split("?")[0];
      /* .../commons/thumb/a/ab/FILE/NNNpx-FILE  or  .../commons/a/ab/FILE */
      const m = /^(https:\/\/[^/]+\/wikipedia\/commons\/)(?:thumb\/)?([0-9a-f]\/[0-9a-f]{2})\/([^/]+\.(?:jpe?g|png|webp))(?:\/|$)/i.exec(src);
      if (m) { const file = m[3];
        res = [o.width > 960 ? m[1]+"thumb/"+m[2]+"/"+file+"/960px-"+file : /\/thumb\//.test(src) ? src : m[1]+m[2]+"/"+file, "https://commons.wikimedia.org/wiki/File:"+file]; } }
    else if (r.status === 404 && !search) {
      /* no page with that exact title: take the best search hit instead */
      const q = await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch="+encodeURIComponent(title));
      const hit = q.ok && ((await q.json()).query || {}).search;
      if (hit && hit[0] && hit[0].title !== title) res = await wikiImg(hit[0].title, cache, true);
    }
  } catch(e) {}
  return cache[title] = res;
}
async function resolvePhotos(src, onStep){
  const cache = {}, jobs = [], img = {hero:null, day:[], stay:[], photos:{}};
  const add = (title, put) => jobs.push(async () => { const p = await wikiImg(title, cache); if (p) put(p); if (onStep) onStep(); });
  add(src.outline.wiki, p => img.hero = p[0]);
  src.days.forEach((d,i) => { if (!d) return;
    (d.stops || []).forEach((s,j) => { if (s.k === "spot" && s.wiki) add(s.wiki, p => img.photos[i+"-"+j] = p); });
    if (d.wiki) add(d.wiki, p => img.day[i] = p[0]);
    if (d.stay_info && d.stay_info.wiki) add(d.stay_info.wiki, p => img.stay[i] = p[0]); });
  await pool(jobs, 6);
  src.days.forEach((d,i) => { if (!img.day[i]) { const k = Object.keys(img.photos).find(x => x.startsWith(i+"-")); if (k) img.day[i] = img.photos[k][0]; } });
  if (!img.hero) img.hero = img.day.find(Boolean) || null;
  return img;
}
async function liveRate(code){
  if (code === "MYR") return 1;
  try { const r = await fetch("https://open.er-api.com/v6/latest/MYR"), j = await r.json(); const v = j && j.rates && j.rates[code]; if (v > 0) return 1 / v; } catch(e) {}
  return null;
}

/* share link: the trip, deflate-compressed, in the URL fragment (never sent to a server) */
async function packTrip(rec){
  const data = new TextEncoder().encode(JSON.stringify({input:rec.input, src:rec.src, img:rec.img, rate:rec.rate, rateDate:rec.rateDate, created:rec.created}));
  const buf = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function unpackTrip(s){
  const bin = atob(s.replace(/-/g,"+").replace(/_/g,"/")), u = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text());
}
async function shareTrip(id){
  const rec = lsRaw("trip:"+id); if (!rec) return;
  try {
    const url = location.origin + location.pathname + "#trip=" + await packTrip(rec);
    if (navigator.share && /Mobi|iPhone|Android/.test(navigator.userAgent)) { await navigator.share({title:t(rec.src.outline.title), url}); return; }
    await navigator.clipboard.writeText(url); tsMsg = t(_("链接已复制（约"+Math.round(url.length/1000)+"k字符）。发到手机上打开，就会导入这个行程。","Link copied (~"+Math.round(url.length/1000)+"k characters). Open it on your phone to import the trip."));
  } catch(e) { if (e.name !== "AbortError") tsMsg = t(_("这个浏览器不支持复制链接，用「导出文件」代替。","This browser can't make the link; use Export file instead.")); }
  paintTrips();
}

}

/* ---- installable app: service worker (offline), install prompt, offline notice ---- */
let instEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const iosOtherBrowser = () => /CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram|Line\/|WhatsApp|MicroMessenger/.test(navigator.userAgent);
const instDismissed = () => { const d = store.get("instdismiss"); return typeof d === "number" && Date.now() - d < 3*86400000; };
function paintBars(){
  const box = $("#appbars"); if (!box) return;
  let h = "";
  if (!navigator.onLine) h += '<div class="abar off"><span>📴 <b>'+t(_("离线中","Offline"))+'</b> · '+t(_("行程、照片、清单、常用句照常可用；地图、翻译、语音需要网络。","Itinerary, photos, checklist and phrasebook still work; maps, translation and voice need a connection."))+'</span></div>';
  if (!isStandalone() && !instDismissed()) {
    if (instEvt) h += '<div class="abar"><img src="img/icons/icon-192.png" alt=""><span><b>'+t(_("安装到手机","Install the app"))+'</b><br>'+t(_("像App一样打开，没网络也能看行程。","Opens like an app and works without signal."))+'</span><button id="instGo">'+t(_("安装","Install"))+'</button><button class="x" id="instX" aria-label="Close">✕</button></div>';
    else if (isIOS() && iosOtherBrowser()) h += '<div class="abar"><img src="img/icons/icon-192.png" alt=""><span>'+t(_("要安装成App，请用 <b>Safari</b> 打开这个网页。","To install it as an app, open this page in <b>Safari</b>."))+'</span><button class="x" id="instX" aria-label="Close">✕</button></div>';
    else if (isIOS()) h += '<div class="abar" id="instTap" role="button" tabindex="0"><img src="img/icons/icon-192.png" alt=""><span><b>'+t(_("加到主屏幕，像App一样用","Add to Home Screen, use it like an app"))+'</b><br>'+t(_("Safari右下角 ••• → 分享 → 添加到主屏幕","Safari ••• (bottom right) → Share → Add to Home Screen"))+'</span><button id="instHow">'+t(_("怎么做","How"))+'</button><button class="x" id="instX" aria-label="Close">✕</button></div>';
  }
  box.innerHTML = h;
  const go = $("#instGo"); if (go) go.onclick = async () => { const e = instEvt; instEvt = null; paintBars(); try { e.prompt(); await e.userChoice; } catch(err) {} };
  const x = $("#instX"); if (x) x.onclick = e => { e.stopPropagation(); store.set("instdismiss", Date.now()); paintBars(); };
  const tap = $("#instTap"); if (tap) tap.onclick = e => { if (!e.target.closest("#instX")) showInstallGuide(); };
}
/* iPhone can't be asked to install from a web page, so show the exact taps instead */
function showInstallGuide(){
  const steps = [
    ["•••", _("点 Safari 右下角的「•••」","Tap “•••” at the bottom right of Safari"), _("旧版Safari：直接点底部中间的分享 ⬆️，跳到第3步","Older Safari: tap Share ⬆️ in the bottom bar and skip to step 3")],
    ["⬆️", _("点「分享」","Tap “Share”"), null],
    ["➕", _("往下滑，点「添加到主屏幕」","Scroll down and tap “Add to Home Screen”"), _("找不到就点最下面的「编辑操作」把它加进来","Not listed? Tap “Edit Actions” at the bottom to add it")],
    ["✅", _("打开「作为网页App打开」，再点右上角「添加」","Keep “Open as Web App” on, then tap “Add”"), null],
    ["✈️", _("回到主屏幕，点纸飞机图标打开","Go to the Home Screen and open the paper-plane icon"), _("在App里重新设置一次ElevenLabs key（App和Safari分开保存）","Set your ElevenLabs key once more inside the app (it is stored separately from Safari)")]
  ];
  let g = $("#instguide");
  if (!g) { g = document.createElement("div"); g.id = "instguide"; g.setAttribute("role","dialog"); g.setAttribute("aria-modal","true"); document.body.appendChild(g); }
  g.innerHTML = '<div class="ig"><div class="ighead"><img src="img/icons/icon-192.png" alt=""><div><b>'+t(_("安装到iPhone主屏幕","Install on your iPhone Home Screen"))+'</b><small>'+t(_("网页不能自己安装，需要你在Safari里点几下","A web page can't install itself; it takes a few taps in Safari"))+'</small></div></div><ol>'+
    steps.map(([ic, a, b]) => '<li><i>'+ic+'</i><div><b>'+esc(t(a))+'</b>'+(b?'<small>'+esc(t(b))+'</small>':'')+'</div></li>').join("")+
    '</ol><button id="igClose">'+t(_("知道了","Got it"))+'</button></div>';
  g.hidden = false;
  g.onclick = e => { if (e.target === g || e.target.id === "igClose") g.hidden = true; };
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); instEvt = e; paintBars(); });
addEventListener("appinstalled", () => { instEvt = null; paintBars(); });
addEventListener("online", paintBars); addEventListener("offline", paintBars);
document.querySelectorAll(".lang button[data-lang]").forEach(b => b.addEventListener("click", paintBars));
paintBars();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(reg => {
    /* pre-download the stop photos once per photo list, so they also work offline */
    const urls = Object.values(PHOTO).map(p => p[0]).concat(META.img.day, META.img.stay).filter(u => u && /^https:/.test(u)), sig = TRIP_ID + ":" + urls.length + ":" + urls[0];
    if (store.get("warmed") !== sig && reg.active) { reg.active.postMessage({type:"warm", urls}); store.set("warmed", sig); }
  }).catch(() => {});
}
</script>
</body>
</html>
